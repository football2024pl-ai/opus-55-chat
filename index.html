<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141923">
  <title>Claude Opus 5.5 — Chat</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 12px;
      background: radial-gradient(circle at top, #222d42, #141923 55%, #0e1118);
      color: #f2f4f8;
      font-family: Inter, system-ui, sans-serif;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 22px;
      border: 1px solid #343b4e;
      border-radius: 18px;
      background: #161b25;
      box-shadow: 0 18px 60px #0005;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    .subtitle {
      color: #aeb5c8;
      font-size: .93rem;
      line-height: 1.5;
      margin: 8px 0 18px;
    }

    #chat {
      min-height: 300px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 14px;
      background: #1a1f2b;
      border: 1px solid #343b4e;
      border-radius: 14px;
    }

    .message {
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message:last-child { margin-bottom: 0; }
    .user { background: #293752; }
    .assistant { background: #252b36; }

    .label {
      display: block;
      margin-bottom: 6px;
      color: #a8c6ff;
      font-weight: 700;
      font-size: .9rem;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 105px;
      margin-top: 14px;
      padding: 14px;
      resize: vertical;
      background: #1a1f2b;
      color: white;
      border: 1px solid #414a60;
      border-radius: 12px;
      font: inherit;
      outline: none;
    }

    textarea:focus { border-color: #83a8ee; }

    .buttons {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #send {
      background: #d8a77c;
      color: #17130f;
    }

    #clear {
      background: #303747;
      color: white;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      min-height: 22px;
      margin-top: 12px;
      color: #aeb5c8;
      font-size: .9rem;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body { padding: 10px 7px; }
      main { padding: 13px; }
      #chat { min-height: 250px; padding: 9px; }
      .message { padding: 10px; }
      button { flex: 1; }
    }
  </style>
</head>

<body>
  <main>
    <h1>Claude Opus 5.5</h1>

    <div class="subtitle">
      ИИ-помощник для программирования, Roblox Studio и Luau.
      История сохраняется в этом браузере.
    </div>

    <div id="chat" aria-live="polite"></div>

    <textarea
      id="prompt"
      placeholder="Напиши свой вопрос..."
      aria-label="Твой вопрос"
    ></textarea>

    <div class="buttons">
      <button id="send">Отправить</button>
      <button id="clear">Очистить чат</button>
    </div>

    <div id="status" role="status"></div>
  </main>

  <script src="https://js.puter.com/v2/"></script>

  <script>
    (() => {
      "use strict";

      const MODEL = "anthropic/claude-opus-5-5";
      const STORAGE_KEY = "opus55_chat_history_v3";
      const MAX_HISTORY = 100;
      const CONTEXT_LENGTH = 40;

      const chat = document.getElementById("chat");
      const promptBox = document.getElementById("prompt");
      const sendButton = document.getElementById("send");
      const clearButton = document.getElementById("clear");
      const status = document.getElementById("status");

      let busy = false;
      let history = loadHistory();

      function loadHistory() {
        try {
          const data = JSON.parse(
            localStorage.getItem(STORAGE_KEY) || "[]"
          );

          if (!Array.isArray(data)) return [];

          return data
            .filter(item =>
              item &&
              ["user", "assistant"].includes(item.role) &&
              typeof item.text === "string"
            )
            .slice(-MAX_HISTORY);
        } catch (_) {
          return [];
        }
      }

      function saveHistory() {
        history = history.slice(-MAX_HISTORY);

        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(history)
          );
        } catch (_) {
          status.textContent =
            "Не удалось сохранить историю в браузере.";
        }
      }

      function addMessage(role, text) {
        const bubble = document.createElement("div");
        bubble.className = "message " + role;

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = role === "user"
          ? "Ты"
          : "Claude / ИИ";

        const content = document.createElement("div");
        content.textContent = text;

        bubble.append(label, content);
        chat.appendChild(bubble);
        chat.scrollTop = chat.scrollHeight;

        return content;
      }

      function renderHistory() {
        chat.replaceChildren();

        if (history.length === 0) {
          addMessage(
            "assistant",
            "Привет! Напиши свой вопрос, и начнём."
          );
          return;
        }

        for (const item of history) {
          addMessage(item.role, item.text);
        }
      }

      function saveMessage(role, text) {
        history.push({ role, text });
        saveHistory();
      }

      // Главное исправление: content может быть строкой,
      // массивом текстовых блоков или null.
      function extractAnswer(response) {
        const content = response?.message?.content;

        if (typeof content === "string") {
          return content.trim();
        }

        if (Array.isArray(content)) {
          return content
            .map(part => {
              if (typeof part === "string") {
                return part;
              }

              if (
                part &&
                typeof part.text === "string"
              ) {
                return part.text;
              }

              return "";
            })
            .filter(Boolean)
            .join("\n")
            .trim();
        }

        if (typeof response?.text === "string") {
          return response.text.trim();
        }

        return "";
      }

      async function sendMessage() {
        if (busy) return;

        const text = promptBox.value.trim();
        if (!text) return;

        if (
          typeof puter === "undefined" ||
          !puter.ai ||
          typeof puter.ai.chat !== "function"
        ) {
          status.textContent =
            "Puter.js не загрузился. Проверь интернет и обнови страницу.";
          return;
        }

        busy = true;
        sendButton.disabled = true;
        promptBox.value = "";

        addMessage("user", text);
        saveMessage("user", text);

        const answerBox = addMessage(
          "assistant",
          "Думаю над ответом..."
        );

        status.textContent = "Отправляю запрос модели...";

        try {
          const messages = [
            {
              role: "system",
              content:
                "Ты полезный ИИ-помощник. Отвечай на русском языке. " +
                "Особенно хорошо помогай с Roblox Studio, Luau и программированием. " +
                "Учитывай предыдущие сообщения. При изменении кода сохраняй " +
                "работающие функции и по возможности давай полный готовый код."
            },
            ...history.slice(-CONTEXT_LENGTH).map(item => ({
              role: item.role,
              content: item.text
            }))
          ];

          const response = await puter.ai.chat(messages, {
            model: MODEL,
            normalize: true
          });

          const answer = extractAnswer(response);

          if (!answer) {
            throw new Error(
              "Модель не вернула текст. Попробуй ещё раз."
            );
          }

          answerBox.textContent = answer;
          saveMessage("assistant", answer);

          status.textContent = "Ответ получен.";

        } catch (error) {
          const errorText = String(
            error?.message || error || "Неизвестная ошибка"
          );

          answerBox.textContent =
            "Не удалось получить ответ.\n\n" + errorText;

          status.textContent =
            "История сохранена. Проверь доступность модели Puter.";

        } finally {
          busy = false;
          sendButton.disabled = false;
          chat.scrollTop = chat.scrollHeight;
          promptBox.focus();
        }
      }

      sendButton.addEventListener("click", sendMessage);

      promptBox.addEventListener("keydown", event => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      });

      clearButton.addEventListener("click", () => {
        if (busy) return;

        history = [];

        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}

        renderHistory();
        status.textContent = "История очищена.";
      });

      renderHistory();
    })();
  </script>
</body>
</html>
